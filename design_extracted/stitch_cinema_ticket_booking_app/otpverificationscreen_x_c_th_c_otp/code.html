<div class="w-full max-w-xs mx-auto pb-safe">

<!-- 1 -->

<!-- 3 -->

<span class="font-headline-md text-headline-md font-semibold leading-none">3</span>

<!-- 4 -->

<!-- 5 -->
<button class="keypad-key w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center active:bg-surface-bright active:scale-95 transition-all text-on-surface shadow-sm" onclick="handleKey('5')" type="button">

<!-- 6 -->

<span class="font-headline-md text-headline-md font-semibold leading-none">7</span>

<span class="font-headline-md text-headline-md font-semibold leading-none">8</span>

<span class="font-headline-md text-headline-md font-semibold leading-none">9</span>
<span class="font-label-sm text-[8px] text-on-surface-variant tracking-widest uppercase opacity-60">WXYZ</span>
</button>

</button>

<button class="keypad-key w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center active:bg-surface-bright active:scale-95 transition-all text-on-surface shadow-sm" onclick="handleKey('0')" type="button">

<script>
  let enteredOtp = [];
  const maxDigits = 6;
  let remainingSeconds = 58;

  function updateOtpUi() {
    for (let i = 0; i < maxDigits; i++) {
      const box = document.getElementById(`slot-${i}`);
      const textElem = box.querySelector('.digit-text');
      const existingCursor = box.querySelector('.cursor-line');

      if (existingCursor) {
        existingCursor.remove();
      }

      if (i < enteredOtp.length) {
        textElem.textContent = enteredOtp[i];
        box.classList.remove('bg-surface-container-highest', 'bg-surface-container', 'shadow-[0_0_12px_rgba(0,218,243,0.4)]');
        box.classList.add('bg-surface-container-high', 'text-primary');
      } else if (i === enteredOtp.length) {
        textElem.textContent = '';
        box.classList.remove('bg-surface-container-high', 'bg-surface-container');
        box.classList.add('bg-surface-container-highest', 'shadow-[0_0_12px_rgba(0,218,243,0.4)]');
        
        const cursor = document.createElement('span');
        cursor.className = 'cursor-line w-0.5 h-6 bg-tertiary-container rounded-full animate-pulse shadow-[0_0_8px_#00daf3]';
        box.appendChild(cursor);
      } else {
        textElem.textContent = '';
        box.classList.remove('bg-surface-container-highest', 'bg-surface-container-high', 'shadow-[0_0_12px_rgba(0,218,243,0.4)]');
        box.classList.add('bg-surface-container');
      }
    }

    const submitBtn = document.getElementById('submit-btn');
    if (enteredOtp.length === maxDigits) {
      submitBtn.removeAttribute('disabled');
      submitBtn.classList.remove('bg-surface-container-high', 'text-on-surface-variant', 'opacity-50');
      submitBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'opacity-100', 'shadow-[0_8px_24px_rgba(255,184,0,0.35)]', 'scale-[1.02]');
      // Auto-trigger confirmation simulation
      setTimeout(verifyCode, 320);
    } else {
      submitBtn.setAttribute('disabled', 'true');
      submitBtn.classList.add('bg-surface-container-high', 'text-on-surface-variant', 'opacity-50');
      submitBtn.classList.remove('bg-primary-container', 'text-on-primary-container', 'opacity-100', 'shadow-[0_8px_24px_rgba(255,184,0,0.35)]', 'scale-[1.02]');
    }
  }

  function handleKey(num) {
    if (enteredOtp.length < maxDigits) {
      enteredOtp.push(num);
      updateOtpUi();
    }
  }

  function handleBackspace() {
    if (enteredOtp.length > 0) {
      enteredOtp.pop();
      updateOtpUi();
    }
  }

  function handleBiometric() {
    // Fill sample valid mock code with subtle feedback
    enteredOtp = ['8', '9', '2', '4', '1', '0'];
    updateOtpUi();
  }

  function verifyCode() {
    const submitBtnText = document.getElementById('submit-btn-text');
    if (submitBtnText) {
      submitBtnText.textContent = 'Đang xác thực...';
    }
  }

  // Timer logic
  const timerInterval = setInterval(() => {
    if (remainingSeconds > 0) {
      remainingSeconds--;
      const min = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
      const sec = String(remainingSeconds % 60).padStart(2, '0');
      const cdElem = document.getElementById('countdown');
      if (cdElem) cdElem.textContent = `${min}:${sec}`;
    } else {
      clearInterval(timerInterval);
      const resendBtn = document.getElementById('resend-btn');
      if (resendBtn) {
        resendBtn.removeAttribute('disabled');
        resendBtn.classList.remove('opacity-40', 'cursor-not-allowed');
        resendBtn.classList.add('text-primary', 'cursor-pointer');
      }
    }
  }, 1000);
</script></main></body></html>
