)]"><div class="h-16 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><img alt="Cinema Star Logo" class="h-7 w-auto object-contain hidden sm:block" src="https://lh3.googleusercontent.com/aida/AEtjO1U_Y5kYgoaMStKq36bg3gPdE3bdWFVUH0N0gfIgKHTfFfTmefrZ_7Etw4AJhiYC6D7Ixd6Ilb9VGiWEKugCy4J3j37w5IJdcuDBoN1l3BNKbqGnG4VfoJzS3v3aWKE2PnvumxedJo3GHyXqio9SlvlnwiL0QZ3bE2HKwVDxDogONPthV6vbFoLe3bXNqEX5d0jzMXNjFxVtqwomtQzWRyNHkef6Ao-GJDx02qoPG24WRA"/></div><h1 class="font-headline-sm text-headline-sm text-on-surface truncate max-w-[200px] text-center">Chi Tiết Phim</h1><div class="flex items-center gap-space-xs"><button aria-label="Share" class="w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-[22px]">share</span></button><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyIbVKVUh9Y65dYCRQm4pIqo8FygPuTbqA2cKks3bLKCfaIh5cqaY9FkC-YDI_MYj9Z58gnjePV0IrblCGvhSR9FoS9ctkWmmefO131qukzaptTuUZmzifTb_18WYHsDQVrpDj1K4qMgr3EcpbhbkJzPHnJPSuvIN6gPKyzBH_Rqy3TK69XcSx6aEWtvw8ROzdC49aOf5Z66MAu_euF0Wb9awocWCIcHRIKkDL1mgT"/></div></div></header><main class="flex flex-col relative w-full pt-16 bg-surface"><div class="flex flex-col w-full pb-safe">
<!-- Subtle Ambient Glow -->
<div class="relative w-full overflow-hidden px-margin-mobile pt-space-md pb-space-xl">
<div class="absolute -top-16 left-1/2 -translate-x-1/2 w-80 h-44 bg-primary-container/15 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-28 -right-12 w-48 h-48 bg-secondary-container/10 rounded-full blur-2xl pointer-events-none"></div>
<!-- Incentive Delight Banner (Physical Ticket Cutout Metaphor) -->
<div class="relative w-full bg-gradient-to-br from-surface-container-high via-surface-container to-surface-container-low rounded-xl p-space-md shadow-xl overflow-hidden mb-space-lg">
<div class="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-surface"></div>
<div class="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-surface"></div>
<div class="flex items-center gap-space-md pl-space-xs pr-space-xs">
<div class="w-12 h-12 rounded-xl bg-primary-container/20 flex items-center justify-center shrink-0 text-primary-container shadow-inner">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-space-xs">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-primary-container">Đặc quyền mới</span>
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container animate-pulse"></span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface truncate">Quà chào mừng Star Pass</span>
<p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1 mt-0.5">Tặng 50 StarPoints + Voucher Bắp rang phô mai miễn phí</p>
</div>
</div>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-space-md" id="registerForm" onsubmit="event.preventDefault(); handleRegistration();">
<!-- Full Name Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="fullName">
<span>Họ và tên</span>
<span class="font-label-sm text-label-sm text-outline">Bắt buộc</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none transition-colors duration-200">person</span>
<input class="w-full bg-surface-container-high text-on-surface placeholder:text-outline/70 font-body-md text-body-md rounded-xl pl-11 pr-4 py-3.5 outline-none transition-all duration-200 focus:bg-surface-variant" id="fullName" placeholder="Nguyễn Văn A" required="" type="text"/>
</div>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="phone">
<span>Số điện thoại</span>
<span class="font-label-sm text-label-sm text-outline">Tích điểm rạp</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center gap-1.5 text-on-surface-variant pointer-events-none">
<span class="material-symbols-outlined text-[20px] text-outline">call</span>
<span class="font-label-md text-label-md text-on-surface">+84</span>
<span class="w-1 h-3.5 bg-outline-variant/60 rounded-full mx-0.5"></span>
</div>
<input class="w-full bg-surface-container-high text-on-surface placeholder:text-outline/70 font-body-md text-body-md rounded-xl pl-24 pr-4 py-3.5 outline-none transition-all duration-200 focus:bg-surface-variant" id="phone" maxlength="10" pattern="[0-9]{9,10}" placeholder="912 345 678" required="" type="tel"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="email">
<span>Địa chỉ Email</span>
<span class="font-label-sm text-label-sm text-outline">Nhận vé &amp; hóa đơn</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none transition-colors duration-200">mail</span>
<input class="w-full bg-surface-container-high text-on-surface placeholder:text-outline/70 font-body-md text-body-md rounded-xl pl-11 pr-4 py-3.5 outline-none transition-all duration-200 focus:bg-surface-variant" id="email" placeholder="cinema.star@domain.com" required="" type="email"/>
</div>
</div>
<!-- Password Field & Dynamic Strength Meter -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="password">
<span>Mật khẩu bảo mật</span>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider" id="strengthLabel">Tối thiểu 8 ký tự</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none transition-colors duration-200">lock</span>
<input class="w-full bg-surface-container-high text-on-surface placeholder:text-outline/70 font-body-md text-body-md rounded-xl pl-11 pr-11 py-3.5 outline-none transition-all duration-200 focus:bg-surface-variant" id="password" oninput="checkPasswordStrength(this.value)" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 w-6 h-6 flex items-center justify-center text-outline hover:text-on-surface transition-colors" onclick="togglePasswordVisibility('password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Strength Meter Bar -->
<div class="flex items-center gap-1.5 pt-1 px-1">
<div class="h-1 flex-1 rounded-full bg-surface-variant transition-colors duration-300" id="bar1"></div>
<div class="h-1 flex-1 rounded-full bg-surface-variant transition-colors duration-300" id="bar2"></div>
<div class="h-1 flex-1 rounded-full bg-surface-variant transition-colors duration-300" id="bar3"></div>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="confirmPassword">
          Xác nhận mật khẩu
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none transition-colors duration-200">verified_user</span>
<input class="w-full bg-surface-container-high text-on-surface placeholder:text-outline/70 font-body-md text-body-md rounded-xl pl-11 pr-11 py-3.5 outline-none transition-all duration-200 focus:bg-surface-variant" id="confirmPassword" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password confirmation visibility" class="absolute right-3.5 w-6 h-6 flex items-center justify-center text-outline hover:text-on-surface transition-colors" onclick="togglePasswordVisibility('confirmPassword', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Birthday Field (Delight incentive) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="birthday">
<span class="flex items-center gap-1">
            Ngày sinh
            <span class="material-symbols-outlined text-[16px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">cake</span>
</span>
<span class="font-label-sm text-label-sm text-secondary-container">Vé xem phim 0đ sinh nhật</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none transition-colors duration-200">calendar_month</span>
<input class="w-full bg-surface-container-high text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl pl-11 pr-4 py-3.5 outline-none transition-all duration-200 focus:bg-surface-variant scheme-dark" id="birthday" required="" type="date"/>
</div>
</div>
<!-- Terms and Conditions Checkbox -->
<div class="flex items-start gap-space-sm pt-space-xs">
<div class="relative flex items-center pt-0.5">
<input class="w-5 h-5 rounded bg-surface-container-high text-primary-container accent-primary-container focus:ring-0 cursor-pointer" id="termsCheckbox" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none leading-relaxed" for="termsCheckbox">
          Tôi đã đọc và đồng ý với 
          <a class="text-primary hover:underline font-label-md text-label-md" href="#">Điều khoản dịch vụ</a> 
          &amp; 
          <a class="text-primary hover:underline font-label-md text-label-md" href="#">Chính sách bảo mật</a> 
          của Cinema Star.
        </label>
</div>
<!-- Visual Perk Micro-Cards -->
<div class="grid grid-cols-2 gap-space-sm pt-space-xs">
<div class="bg-surface-container-low rounded-xl p-space-sm flex items-center gap-space-xs">
<span class="material-symbols-outlined text-tertiary text-[20px]">movie</span>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-on-surface truncate">Ghế VIP</span>
<span class="font-body-sm text-[10px] text-outline truncate">Giữ chỗ trước 15p</span>
</div>
</div>
<div class="bg-surface-container-low rounded-xl p-space-sm flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary-container text-[20px]">local_activity</span>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-on-surface truncate">Tích StarPoints</span>
<span class="font-body-sm text-[10px] text-outline truncate">Đổi vé &amp; combo bắp</span>
</div>
</div>
</div>
<!-- Primary Action CTA -->
<div class="pt-space-sm">
<button class="w-full relative overflow-hidden bg-gradient-to-r from-primary-container via-primary-fixed-dim to-secondary-container text-on-primary py-4 px-space-md rounded-xl font-label-lg text-label-lg uppercase tracking-wider shadow-[0_8px_24px_rgba(255,184,0,0.3)] active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs group" id="submitBtn" type="submit">
<span class="relative z-10 flex items-center gap-space-xs">
<span>Đăng ký thành viên</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>
</form>
<!-- Footer Login Link -->
<div class="mt-space-lg flex items-center justify-center gap-1.5 text-center">
<span class="font-body-md text-body-md text-on-surface-variant">Đã có tài khoản?</span>
<button class="font-label-lg text-label-lg text-primary hover:text-primary-container transition-colors inline-flex items-center gap-0.5" type="button">
<span>Đăng nhập ngay</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</button>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility(fieldId, triggerBtn) {
    const input = document.getElementById(fieldId);
    const icon = triggerBtn.querySelector('.material-symbols-outlined');
    if (!input || !icon) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function checkPasswordStrength(val) {
    const b1 = document.getElementById('bar1');
    const b2 = document.getElementById('bar2');
    const b3 = document.getElementById('bar3');
    const label = document.getElementById('strengthLabel');
    if (!b1 || !b2 || !b3 || !label) return;

    // Reset base classes
    b1.className = 'h-1 flex-1 rounded-full bg-surface-variant transition-colors duration-300';
    b2.className = 'h-1 flex-1 rounded-full bg-surface-variant transition-colors duration-300';
    b3.className = 'h-1 flex-1 rounded-full bg-surface-variant transition-colors duration-300';

    if (!val || val.length === 0) {
      label.textContent = 'Tối thiểu 8 ký tự';
      label.className = 'font-label-sm text-label-sm text-outline uppercase tracking-wider';
      return;
    }

    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 8 && /[0-9]/.test(val) && /[a-zA-Z]/.test(val)) score++;
    if (val.length >= 10 && /[^a-zA-Z0-9]/.test(val)) score++;

    if (score === 1) {
      b1.className = 'h-1 flex-1 rounded-full bg-error transition-colors duration-300';
      label.textContent = 'Yếu';
      label.className = 'font-label-sm text-label-sm text-error uppercase tracking-wider';
    } else if (score === 2) {
      b1.className = 'h-1 flex-1 rounded-full bg-primary-container transition-colors duration-300';
      b2.className = 'h-1 flex-1 rounded-full bg-primary-container transition-colors duration-300';
      label.textContent = 'Trung bình';
      label.className = 'font-label-sm text-label-sm text-primary-container uppercase tracking-wider';
    } else if (score >= 3) {
      b1.className = 'h-1 flex-1 rounded-full bg-tertiary-container transition-colors duration-300';
      b2.className = 'h-1 flex-1 rounded-full bg-tertiary-container transition-colors duration-300';
      b3.className = 'h-1 flex-1 rounded-full bg-tertiary-container transition-colors duration-300';
      label.textContent = 'Rất mạnh';
      label.className = 'font-label-sm text-label-sm text-tertiary-container uppercase tracking-wider';
    }
  }

  function handleRegistration() {
    const pwd = document.getElementById('password')?.value;
    const confirmPwd = document.getElementById('confirmPassword')?.value;
    
    if (pwd !== confirmPwd) {
      alert('Mật khẩu xác nhận không khớp! Vui lòng kiểm tra lại.');
      return;
    }
    
    const btn = document.getElementById('submitBtn');
    if (btn) {
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Đang khởi tạo Star Member...</span>';
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Đăng ký thành công!</span>';
      }, 1200);
    }
  }
</script></main></body></html>
