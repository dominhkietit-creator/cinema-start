<div class="absolute -top-24 -left-20 w-72 h-72 rounded-full bg-secondary-container/15 blur-3xl pointer-events-none"></div>

</div>

<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high/80 text-primary mb-space-xs shadow-inner">

<span class="font-label-sm text-label-sm tracking-wider uppercase text-primary">Star Club Member</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-space-xs">
      Chào mừng trở lại!
    </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs leading-relaxed">
      Đăng nhập để nhận ưu đãi vé xem phim độc quyền và tích điểm <span class="text-primary font-medium">Star Club</span>.
    </p>
</header>
<!-- Login Glassmorphic Container -->
<div class="relative z-10 w-full rounded-xl bg-surface-container/85 backdrop-blur-xl p-space-md shadow-2xl flex flex-col gap-space-md">
<!-- Input: Phone / Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="login-account">
<span>Số điện thoại hoặc Email</span>
<span class="text-tertiary text-[11px] font-label-sm lowercase tracking-normal">Chính xác</span>
</label>
<div class="relative flex items-center rounded-lg bg-surface-container-lowest focus-within:bg-surface-container-low transition-colors duration-200 shadow-inner">
<div class="pl-3.5 pr-2 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">alternate_email</span>
</div>
<input class="w-full py-3 pr-3.5 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none" id="login-account" placeholder="vidu@cinemastar.vn" type="text"/>
</div>
</div>
<!-- Input: Password -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="login-password">
        Mật khẩu
      </label>
<div class="relative flex items-center rounded-lg bg-surface-container-lowest focus-within:bg-surface-container-low transition-colors duration-200 shadow-inner">
<div class="pl-3.5 pr-2 flex items-center pointer-events-none text-outline">

</div>

<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Options Row: Remember & Forgot -->
<div class="flex items-center justify-between pt-0.5 pb-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input class="w-4 h-4 rounded bg-surface-container-lowest accent-primary-container cursor-pointer" id="remember-me" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Ghi nhớ đăng nhập</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#forgot-password">
        Quên mật khẩu?
      </a>
</div>
<!-- Primary CTA: Submit & Biometric Cluster -->
<div class="flex items-center gap-space-sm pt-1">
<button class="flex-1 py-3.5 px-4 rounded-lg bg-gradient-to-r from-primary-container via-primary-fixed-dim to-primary-container text-on-primary font-label-lg text-label-lg tracking-wider uppercase font-bold shadow-[0_8px_24px_rgba(255,184,0,0.35)] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
<span>Đăng nhập</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Biometric Login Button -->
<button class="w-12 h-12 flex-shrink-0 rounded-lg bg-surface-container-high hover:bg-surface-bright active:scale-95 transition-all text-tertiary flex items-center justify-center shadow-md relative group" id="btn-biometric" title="Đăng nhập Face ID / Touch ID" type="button">
<span class="material-symbols-outlined text-[26px]">fingerprint</span>
<span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-tertiary shadow-[0_0_8px_#00daf3]"></span>
</button>
</div>
<!-- Divider -->
<div class="relative flex items-center justify-center my-1">
<div class="w-full h-px bg-surface-container-highest"></div>
<span class="absolute px-3 bg-surface-container text-outline font-label-sm text-label-sm uppercase tracking-widest">
        Hoặc đăng nhập bằng
      </span>
</div>
<!-- Social Sign In Grid -->
<div class="grid grid-cols-4 gap-2.5 pt-0.5">
<!-- Google -->
<button class="h-11 rounded-lg bg-surface-container-low hover:bg-surface-container-high active:scale-95 transition-all flex items-center justify-center shadow-sm" title="Google" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z" fill="#EA4335"></path>

<path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z" fill="#34A853"></path>
</svg>
</button>
<!-- Apple -->
<button class="h-11 rounded-lg bg-surface-container-low hover:bg-surface-container-high active:scale-95 transition-all flex items-center justify-center text-on-surface shadow-sm" title="Apple ID" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.74 1.02-1.77.91-2.8-.88.04-1.95.59-2.58 1.33-.56.64-.99 1.69-.86 2.7.98.08 1.97-.49 2.53-1.23z"></path>
</svg>
</button>
<!-- Zalo -->
<button class="h-11 rounded-lg bg-surface-container-low hover:bg-surface-container-high active:scale-95 transition-all flex items-center justify-center shadow-sm" title="Zalo" type="button">
<span class="font-headline-sm text-[15px] font-extrabold text-[#0068FF] tracking-tighter">Zalo</span>
</button>
<!-- Facebook -->
<button class="h-11 rounded-lg bg-surface-container-low hover:bg-surface-container-high active:scale-95 transition-all flex items-center justify-center text-[#1877F2] shadow-sm" title="Facebook" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
</button>
</div>
</div>
<!-- Star Club Perks Mini Teaser -->
<div class="relative z-10 mt-space-md p-space-sm rounded-lg bg-surface-container-low flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[22px]">confirmation_number</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface font-semibold truncate">Đặc quyền hội viên Star</span>
<span class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1">Giảm 20% combo bỏng nước thứ Tư hàng tuần</span>
</div>
</div>
<!-- Footer Link -->
<footer class="relative z-10 mt-space-lg text-center pb-safe">
<p class="font-body-md text-body-md text-on-surface-variant">
      Chưa có tài khoản? 
      <a class="font-label-lg text-label-lg text-primary hover:text-primary-fixed underline underline-offset-4 decoration-primary/40 font-semibold ml-1" href="#register">
        Đăng ký ngay
      </a>
</p>
</footer>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('btn-toggle-pwd');
    const pwdInput = document.getElementById('login-password');
    const pwdIcon = document.getElementById('pwd-icon');
    const biometricBtn = document.getElementById('btn-biometric');

    if (toggleBtn && pwdInput && pwdIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }

    if (biometricBtn) {
      biometricBtn.addEventListener('click', function() {
        biometricBtn.classList.add('scale-90');
        setTimeout(() => biometricBtn.classList.remove('scale-90'), 150);
      });
    }
  })();
</script></main></body></html>
