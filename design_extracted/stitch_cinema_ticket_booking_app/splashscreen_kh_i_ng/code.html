<script>
  (function() {
    const statusText = document.getElementById('splash-status-text');
    const progressBar = document.getElementById('splash-progress');
    
    if (!statusText || !progressBar) return;

    const stages = [
      { progress: 42, text: 'Kết nối cụm rạp trung tâm...' },
      { progress: 78, text: 'Đồng bộ lịch chiếu & sơ đồ ghế VIP...' },
      { progress: 100, text: 'Sẵn sàng khởi chiếu!' }
    ];

    let current = 0;
    const interval = setInterval(() => {
      if (current < stages.length) {
        statusText.style.opacity = '0';
        setTimeout(() => {
          progressBar.style.width = stages[current].progress + '%';
          statusText.textContent = stages[current].text;
          statusText.style.opacity = '1';
          current++;
        }, 180);
      } else {
        clearInterval(interval);
      }
    }, 1100);
  })();
